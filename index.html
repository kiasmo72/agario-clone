<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Agar.io Prototipo Finale - Spine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #c4c4c4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas { display: block; background-color: #ffffff; }

        #startMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
            z-index: 10;
        }
        #startMenu h1 { margin-top: 0; color: #2c3e50; }
        #nickInput {
            width: 85%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            margin-bottom: 20px;
            outline: none;
        }
        #startBtn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            width: 95%;
        }
        #startBtn:hover { background-color: #2980b9; }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 220px;
            pointer-events: none;
            display: none; 
        }
        #leaderboard h3 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #bdc3c7;
            padding-bottom: 5px;
        }
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-weight: bold;
            color: #34495e;
        }

        #gameOverScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px 50px;
            text-align: center;
            border-radius: 15px;
            z-index: 10;
        }
        #respawnBtn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="startMenu">
        <h1>Agar.io Pro</h1>
        <input type="text" id="nickInput" placeholder="Inserisci Nickname" maxlength="14">
        <button id="startBtn">Gioca</button>
    </div>

    <div id="leaderboard">
        <h3>CLASSIFICA</h3>
        <div id="leaderboardContent"></div>
    </div>

    <div id="gameOverScreen">
        <h1>Sei stato eliminato!</h1>
        <button id="respawnBtn">Rigioca</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startMenu = document.getElementById('startMenu');
        const startBtn = document.getElementById('startBtn');
        const nickInput = document.getElementById('nickInput');
        const leaderboard = document.getElementById('leaderboard');
        const leaderboardContent = document.getElementById('leaderboardContent');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const respawnBtn = document.getElementById('respawnBtn');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${window.location.host}`);

        let myId = null;
        let players = {};
        let food = [];
        let obstacles = []; 
        let mapWidth = 3500;
        let mapHeight = 3500;
        let inGame = false;

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'welcome') {
                myId = data.id;
                mapWidth = data.mapWidth;
                mapHeight = data.mapHeight;
            }

            if (data.type === 'spawn_confirm') {
                inGame = true;
                startMenu.style.display = 'none';
                gameOverScreen.style.display = 'none';
                leaderboard.style.display = 'block';
            }

            if (data.type === 'update') {
                players = data.players;
                food = data.food;
                obstacles = data.obstacles || [];
                
                updateLeaderboardUI(data.leaderboard);
                
                if (inGame && myId && players[myId] && players[myId].dead) {
                    inGame = false;
                    gameOverScreen.style.display = 'block';
                }
                
                drawGame();
            }
        };

        startBtn.addEventListener('click', () => {
            let name = nickInput.value.trim();
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'join', name: name }));
            }
        });
        respawnBtn.addEventListener('click', () => {
            let name = nickInput.value.trim();
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'respawn', name: name }));
            }
        });

        window.addEventListener('mousemove', (event) => {
            if (socket.readyState === WebSocket.OPEN && inGame && players[myId]) {
                let me = players[myId];
                let avgX = 0, avgY = 0;
                me.cells.forEach(c => { avgX += c.x; avgY += c.y; });
                avgX /= me.cells.length;
                avgY /= me.cells.length;

                let mouseRelX = event.clientX - canvas.width / 2;
                let mouseRelY = event.clientY - canvas.height / 2;

                socket.send(JSON.stringify({
                    type: 'move',
                    x: avgX + mouseRelX,
                    y: avgY + mouseRelY
                }));
            }
        });

        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space' && inGame && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'split' }));
            }
        });

        function updateLeaderboardUI(list) {
            if (!list || !inGame) return;
            let html = "";
            list.forEach((item, index) => {
                html += `<div class="leaderboard-row"><span>${index + 1}. ${item.name}</span><span>${item.score}</span></div>`;
            });
            leaderboardContent.innerHTML = html;
        }

        function drawSpikeyObstacle(x, y, radius) {
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = '#2ecc71'; 
            ctx.strokeStyle = '#27ae60'; 
            ctx.lineWidth = 4;
            
            let spikes = 18; 
            let outerRadius = radius;
            let innerRadius = radius - 10;
            let rot = Math.PI / 2 * 3;
            let cx = x;
            let cy = y;
            let step = Math.PI / spikes;

            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                let px = cx + Math.cos(rot) * outerRadius;
                let py = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(px, py);
                rot += step;

                px = cx + Math.cos(rot) * innerRadius;
                py = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(px, py);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!inGame || !players[myId]) return;
            let me = players[myId];

            let camX = 0, camY = 0;
            me.cells.forEach(c => { camX += c.x; camY += c.y; });
            camX /= me.cells.length;
            camY /= me.cells.length;

            ctx.save();
            ctx.translate(canvas.width / 2 - camX, canvas.height / 2 - camY);

            ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, mapWidth, mapHeight);

            ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1;
            for (let x = 0; x <= mapWidth; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapHeight); ctx.stroke();
            }
            for (let y = 0; y <= mapHeight; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(mapWidth, y); ctx.stroke();
            }

            for (let i = 0; i < food.length; i++) {
                let f = food[i];
                ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color; ctx.fill(); ctx.closePath();
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                drawSpikeyObstacle(obs.x, obs.y, obs.radius);
            }

            for (let id in players) {
                let p = players[id];
                if (p.dead) continue;

                p.cells.forEach(cell => {
                    ctx.beginPath();
                    ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.closePath();

                    ctx.fillStyle = "#ffffff";
                    ctx.font = `bold ${Math.max(11, cell.radius * 0.38)}px Arial`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = Math.max(2, cell.radius * 0.08);
                    ctx.strokeText(p.name, cell.x, cell.y);
                    ctx.fillText(p.name, cell.x, cell.y);

                    if (id === myId) {
                        ctx.strokeStyle = '#2c3e50';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            }

            ctx.restore();
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
